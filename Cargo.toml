[package]
name = "puls"
version = "0.10.0"
edition = "2021"
authors = ["word-sys"]
description = "A unified system monitoring and management tool for Linux"
license = "GPL-3.0"
repository = "https://github.com/word-sys/puls"

[[bin]]
name = "puls"
path = "src/main.rs"

[dependencies]

[features]
default = ["docker"]
docker = []
full = ["docker"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[package.metadata.deb]
maintainer = "word-sys <baringuzeldemir@gmail.com>"
copyright = "2026, word-sys"
revision = ""
depends = "$auto" 
section = "utils"
priority = "optional"
extended-description = """\
PULS is a zero-dependency terminal-based Linux system monitoring and administration tool.
Features:
- Pure Rust standard library + direct Linux /proc, /sys, FFI, and ANSI TUI engine (0 external crates)
- CPU, NUMA, Memory, ZRAM, PSI, Disks (await/busy/scheduler), Network & Socket Inspector
- GPU monitoring (dynamic NVML, AMD/Intel DRM VRAM attribution)
- Process management (tree, signals, renice, CPU affinity, I/O priority, cgroup/PSS)
- Service control (systemd system & --user, timers, boot blame, structured journald)
- Docker & Podman monitoring over native Unix socket HTTP + cgroup v2 fast-path
- Transactional GRUB, systemd-boot, and live kernel sysctl editor
- Headless telemetry snapshots (--snapshot) and JSONL flight recorder (--record / --replay)
"""
assets = [
    ["target/release/puls", "usr/bin/", "755"],
    ["puls.desktop", "usr/share/applications/", "644"],
    ["puls_icon.svg", "usr/share/icons/hicolor/scalable/apps/puls.svg", "644"],
]
