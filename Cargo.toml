[package]
name = "puls"
version = "0.9.3"
edition = "2021"
authors = ["word-sys"]
description = "A unified system monitoring and management tool for Linux"
license = "GPL-3.0"
repository = "https://github.com/word-sys/puls"

[[bin]]
name = "puls"
path = "src/main.rs"

[dependencies]
sysinfo = "0.33"  

bollard = { version = "0.19", optional = true }
futures-util = { version = "0.3", optional = true }

ratatui = "0.26"
crossterm = "0.28"

tokio = { version = "1.0", features = ["full"] }

env_logger = "0.11"
log = "0.4"

[features]
default = ["docker"]
docker = ["dep:bollard", "dep:futures-util"]
full = ["docker"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[package.metadata.deb]
maintainer = "word-sys <baringuzeldemir@gmail.com>"
copyright = "2026, word-sys"
depends = "$auto" 
section = "utils"
priority = "optional"
extended-description = """\
PULS is a terminal-based system monitoring tool.
Features:
- CPU, Memory, Disk, Network monitoring
- GPU monitoring (NVIDIA, AMD, Intel)
- Process management
- Service control (systemd)
- Docker monitoring
- System information
- GRUB configuration
"""
assets = [
    ["target/release/puls", "usr/bin/", "755"],
    ["puls.desktop", "usr/share/applications/", "644"],
    ["puls_icon.svg", "usr/share/icons/hicolor/scalable/apps/puls.svg", "644"],
]
