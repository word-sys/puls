name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.deb_arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            deb_arch: amd64
            tar_arch: x86_64-linux-musl
            packages: musl-tools debhelper dpkg-dev
            linker: ""
          - target: aarch64-unknown-linux-musl
            deb_arch: arm64
            tar_arch: aarch64-linux-musl
            packages: musl-tools gcc-aarch64-linux-gnu debhelper dpkg-dev
            linker: "aarch64-linux-gnu-gcc"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - name: Build static MUSL binary
        run: |
          if [ -n "${{ matrix.linker }}" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER="${{ matrix.linker }}"
          fi
          cargo build --release --target ${{ matrix.target }}

      - name: Package tar.gz archive
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/puls dist/puls
          tar -czf dist/puls-${VERSION}-${{ matrix.tar_arch }}.tar.gz \
            -C dist puls \
            -C ${{ github.workspace }} README.md README.tr.md README.fr.md README.de.md README.es.md README.it.md README.ru.md LICENSE
          rm dist/puls

      - name: Build Debian packages
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          dpkg-buildpackage -b -us -uc -d --host-arch ${{ matrix.deb_arch }}
          cp ../puls_${VERSION}_${{ matrix.deb_arch }}.deb dist/ || true
          cp ../puls_${VERSION}_${{ matrix.deb_arch }}.buildinfo dist/ || true
          cp ../puls_${VERSION}_${{ matrix.deb_arch }}.changes dist/ || true
          if [ ! -f "dist/puls_${VERSION}_${{ matrix.deb_arch }}.deb" ]; then
            cargo install cargo-deb || true
            cargo deb --no-build --target ${{ matrix.target }} --deb-revision ""
            cp target/${{ matrix.target }}/debian/*.deb dist/ || true
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.deb_arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.buildinfo
            dist/*.changes

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract Release Notes from CHANGELOG.md
        run: |
          awk -v tag="${GITHUB_REF_NAME}" '
            index($0, "## [" tag "]") == 1 || index($0, "## [v" tag "]") == 1 { found=1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release ${GITHUB_REF_NAME}" > release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "PULS ${{ github.ref_name }}"
          body_path: release_notes.md
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
